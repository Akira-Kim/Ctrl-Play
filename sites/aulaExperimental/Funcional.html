<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HTML + CSS + JavaScript</title>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #2c3e50;
        }

        #mensagem {
            font-size: 22px;
            color: #27ae60;
            margin: 20px 0;
            min-height: 30px;
        }

        button {
            background-color: #e74c3c;
            color: white;
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>
    <h1>Interação com JavaScript</h1>
    
    <div id="mensagem"></div>
    
    <button onclick="mostrarMensagem()">Clique para aparecer uma mensagem</button>

    <script>
        function mostrarMensagem() {
            document.getElementById("mensagem").innerHTML = "Parabéns! Você usou HTML, CSS e JavaScript juntos!";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>HTML + CSS</title>
    <style>
        body {
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #2c3e50;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .botao {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .botao:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <h1>Página com CSS</h1>
    <p>Agora a página tem cores e estilo!</p>
    <button class="botao">Clique em mim</button>
</body>
</html>
